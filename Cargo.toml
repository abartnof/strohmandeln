[workspace]
resolver = "2"
members = [
    "crates/strohmandeln-core",
    "crates/strohmandeln-ai",
    "crates/strohmandeln-wasm",
    "crates/strohmandeln-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# The page ships built from one pinned toolchain, so an older MSRV buys nothing.
rust-version = "1.98"

[profile.release]
lto = true
codegen-units = 1

# The property tests play whole sittings; at opt-level 0 they would crawl.
# Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 2
